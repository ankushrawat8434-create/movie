      justify-content: center;
      background: #f5f5f5;

      font-family: Arial, sans-serif;
    }

    .video-container {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;

    }

    .video-container video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;

    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

    }
